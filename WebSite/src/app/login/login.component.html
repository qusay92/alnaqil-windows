<div class="login">
  <div class="container">
    <div class="row">
      <div class="col-xl-5 col-lg-6 col-md-12 bg-color">
        <div class="form-section">
          <div class="logo">
            <a href="/">
              <img src="assets/images/logo.svg" alt="logo" />
            </a>
          </div>
          <h3>{{ "LoginComponent.ClientLogin" | translate }}</h3>
          <div class="login-inner-form">
            <form [formGroup]="ngForm" (keyup.enter)="login()">
              <div class="form-group clearfix">
                <label for="Username" class="form-label">{{
                  "LoginComponent.UserName" | translate
                }}</label>
                <div class="form-box">
                  <input
                    name="Username"
                    type="text"
                    class="form-control"
                    id="Username"
                    placeholder="{{ 'LoginComponent.UserName' | translate }}"
                    formControlName="username"
                    [ngClass]="
                      ngForm.controls['username'].valid || !isSubmitted
                        ? ''
                        : 'is-invalid'
                    "
                  />
                  <div class="invalid-feedback">
                    {{ "LoginComponent.UsernameIsRequired" | translate }}
                  </div>
                  <i class="bi bi-person"></i>
                </div>
              </div>
              <div class="form-group clearfix">
                <label for="Password" class="form-label">{{
                  "LoginComponent.Password" | translate
                }}</label>
                <div class="form-box">
                  <input
                    name="Password"
                    type="password"
                    class="form-control"
                    autocomplete="off"
                    id="Password"
                    placeholder="{{ 'LoginComponent.Password' | translate }}"
                    formControlName="password"
                    [ngClass]="
                      ngForm.controls['password'].valid || !isSubmitted
                        ? ''
                        : 'is-invalid'
                    "
                  />
                  <div class="invalid-feedback">
                    {{ "LoginComponent.PasswordIsRequired" | translate }}
                  </div>
                  <i class="bi bi-lock"></i>
                </div>
              </div>
              <div class="form-group clearfix mb-0">
                <button
                  type="submit"
                  class="btn btn-primary btn-lg btn-theme"
                  (click)="login()"
                >
                  {{ "LoginComponent.Login" | translate }}
                </button>
              </div>
            </form>
            <a href="/"
              class="d-flex font-weight-bold justify-content-center mb-0 mt-3 small text-black-50"
            >
              <i class="bi bi-arrow-left mr-1"></i> Back to Home
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
